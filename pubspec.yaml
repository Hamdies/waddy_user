name: waddy_app
description: A Multi-vendor1 Food. Grocery, eCommerce, Pharmacy & Parcel service.
publish_to: 'none' #
version: 1.0.0+2

environment:
  sdk: '>=3.7.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  shared_preferences: ^2.3.4
  connectivity_plus: ^6.1.3
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.0
  firebase_auth: ^5.2.0
  path_provider: ^2.1.4
  pin_code_fields: ^8.0.1
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  flutter_typeahead: ^4.3.7
  carousel_slider: ^5.0.0
  shimmer_animation: ^2.2.1
  image_picker: ^1.1.2
  image_picker_ios: ^0.8.5+6
  flutter_inappwebview: ^6.1.0
  url_launcher: ^6.3.0
  http: ^1.2.2
  phone_numbers_parser: ^9.0.0
  country_code_picker: ^3.3.0
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
#  image_compression_flutter: ^1.0.4
  dotted_border: ^2.1.0
  share_plus: ^10.0.2
  # Renders the voucher QR the venue scans at the counter
  qr_flutter: ^4.1.0
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.2
  facebook_app_events: ^0.23.0
  app_links: ^6.4.0
  app_tracking_transparency: ^2.0.6
  sign_in_with_apple: ^6.1.3
  intl: ^0.19.0
  just_the_tooltip: ^0.0.12
  flutter_slidable: ^3.1.2
  animated_flip_counter: ^0.3.4
  youtube_player_iframe: ^5.1.5
  card_swiper: ^3.0.1
  audioplayers: ^6.1.0
  flutter_sound: ^9.16.3
  video_player: ^2.9.1
  flutter_svg: ^2.2.2
  flutter_widget_from_html_core: ^0.15.2
  smooth_page_indicator: ^1.2.0+3
  chewie: ^1.8.4
  location: ^7.0.0
  drift: ^2.21.0
  drift_flutter: ^0.2.1
  lottie: ^3.2.0
  dropdown_button2: ^2.3.9
  file_picker: ^8.1.2
  path: ^1.9.0
  hugeicons: ^1.2.0
  scratcher: ^2.5.0
  rive: ^0.14.11
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.3
  uuid: ^4.4.0


dependency_overrides:
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  drift_dev: ^2.21.2
  build_runner: ^2.4.13

flutter:
  # facebook_app_events supports SPM but flutter_facebook_auth does not, so with
  # SPM enabled the Facebook SDK frameworks get embedded twice (once by SPM, once
  # by CocoaPods), failing the iOS build with "Multiple commands produce
  # .../Frameworks/FBSDKCoreKit.framework". Keep all iOS plugins on CocoaPods.
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/image/
    - assets/image/wallet_ch/
    - assets/language/
    - assets/map/
    - assets/json/
    - assets/animation/
    - assets/animation/bottom_nav/
    - assets/on_boarding/

  fonts:
    # Body face — Thmanyah Sans. Was declared as `Roboto` purely as a leftover
    # template alias; the assets were always Thmanyah.
    - family: ThmanyahSans
      fonts:
        - asset: assets/font/thmanyahsans-Light.otf
          weight: 100
        - asset: assets/font/thmanyahsans-Regular.otf
          weight: 400
        - asset: assets/font/thmanyahsans-Medium.otf
          weight: 500
        - asset: assets/font/thmanyahsans-Bold.otf
          weight: 700
        - asset: assets/font/thmanyahsans-Black.otf
          weight: 900
    # Display face. Previously this family name pointed at the same Thmanyah
    # files as `Roboto` above, so declaring it changed nothing and the whole app
    # rendered in one family. The Alexandria TTFs were already in assets/font/
    # and simply unreferenced. Alexandria carries Arabic and Latin in one
    # family, which is why it can be the display face without the headline
    # falling back to a different typeface under `ar`.
    - family: Alexandria
      fonts:
        - asset: assets/font/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/font/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/font/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/font/Alexandria-Bold.ttf
          weight: 700
        - asset: assets/font/Alexandria-ExtraBold.ttf
          weight: 800
        - asset: assets/font/Alexandria-Black.ttf
          weight: 900