plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.hamdiesolutions.waddi"
    compileSdk 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.hamdiesolutions.waddi"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    // Dev, staging and prod install side by side.
    //
    // Before this, there was one applicationId and one hardcoded backend URL,
    // so testing against anything but live customer data meant editing a
    // constant — and a developer build replaced the real app on the device.
    // Distinct ids mean a tester can hold all three at once and never wonder
    // which one they are looking at.
    //
    // The Dart side is selected separately, with
    // `--dart-define-from-file=env/<flavor>.json`; `flutter build --flavor` only
    // picks the Gradle variant. Both are required, and `release-guard` in CI
    // checks the pair matches so a prod-signed build cannot carry staging
    // defines.
    flavorDimensions "environment"
    productFlavors {
        dev {
            dimension "environment"
            // NO applicationIdSuffix, deliberately — for now.
            //
            // A suffixed id needs its own Firebase Android app, and
            // com.hamdiesolutions.waddi.dev has not been registered yet, so
            // the google-services plugin refuses the build. Blocking every
            // developer run on a console task nobody has done yet is worse
            // than sharing an id.
            //
            // What still differs, and is what dev is actually for: the
            // versionName suffix, the launcher label, and — the important one
            // — the backend, which comes from
            // `--dart-define-from-file=env/dev.json`, not from here.
            //
            // The cost of sharing the id is that a dev build replaces the
            // prod app on the device. Restore the suffix (and add
            // android/app/src/dev/google-services.json) the moment the
            // Firebase app exists; see android/app/src/prod/README.md.
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Waddy Dev"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            resValue "string", "app_name", "Waddy Staging"
        }
        prod {
            dimension "environment"
            // No suffix: this is the id the Play listing and every existing
            // install already use. Changing it would orphan every user.
            resValue "string", "app_name", "Waddy"
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            // Strips unused entries from the ANDROID resource table (drawables,
            // layouts, and everything the Firebase/Maps/plugin AARs bring in).
            // It does not touch flutter_assets — that payload is governed by
            // the `assets:` block in pubspec.yaml.
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Fails a dev/staging build early, with an explanation, instead of letting the
// google-services plugin die on "No matching client found for package name".
// Those flavors carry an applicationId suffix, so they need their own Firebase
// app registered — see android/app/src/prod/README.md.
tasks.configureEach { task ->
    if (task.name ==~ /process(Staging)\w*GoogleServices/) {
        task.doFirst {
            def flavor = 'staging'
            def cfg = file("src/${flavor}/google-services.json")
            if (!cfg.exists()) {
                throw new GradleException(
                    "Missing android/app/src/${flavor}/google-services.json.\n" +
                    "The ${flavor} flavor builds com.hamdiesolutions.waddi.${flavor}, " +
                    "which needs its own Firebase Android app.\n" +
                    "See android/app/src/prod/README.md for the three steps.\n" +
                    "Until then, build with --flavor prod."
                )
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    implementation "com.google.firebase:firebase-messaging:23.4.1"
}
