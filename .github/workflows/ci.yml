  i18n-guard:
    # A key present in en.json but missing from ar.json renders as the raw key
    # to Arabic users — half the market — and nothing fails until someone sees
    # it on a screenshot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: en.json and ar.json declare the same keys
        run: |
          python3 - <<'PY'
          import json, sys
          en = json.load(open('assets/language/en.json'))
          ar = json.load(open('assets/language/ar.json'))
          missing_ar = sorted(set(en) - set(ar))
          missing_en = sorted(set(ar) - set(en))
          # RATCHET: lower both as keys are backfilled. Never raise them.
          BUDGET_AR, BUDGET_EN = 36, 24
          print(f"missing in ar: {len(missing_ar)} (budget {BUDGET_AR})")
          print(f"missing in en: {len(missing_en)} (budget {BUDGET_EN})")
          fail = False
          if len(missing_ar) > BUDGET_AR:
              print("::error::keys missing from ar.json: " + ", ".join(missing_ar[:20]))
              fail = True
          if len(missing_en) > BUDGET_EN:
              print("::error::keys missing from en.json: " + ", ".join(missing_en[:20]))
              fail = True
          sys.exit(1 if fail else 0)
          PY

  flavor-guard:
    # Every developer run used to hit production, because there was one
    # hardcoded base URL. Now the backend is chosen at build time. These checks
    # make sure it stays that way: no literal production host outside the env
    # files, and the defaults fail safe onto staging.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
      - run: flutter pub get

      - name: The production host is not hardcoded in lib/
        run: |
          # env/prod.json is the only place the production host belongs. A bare
          # "https://waddyapp.com" in lib/ pins that code path to production
          # regardless of flavor, which is the bug this whole change removes.
          #
          # Excluded: AppEnvironment's own staging fallback (the fail-safe
          # default) and comments, which cannot affect a build. The pattern
          # therefore matches the production host only, not the staging
          # subdomain, and only in real code.
          hits=$(grep -rn "['\"]https://waddyapp\.com" lib --include="*.dart" \
                   | grep -v "^lib/util/app_environment.dart:" \
                   | grep -v "^[^:]*:[0-9]*: *//" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::hardcoded production host in lib/ — use AppEnvironment"
            exit 1
          fi
          echo "clean"

      - name: Defaults fail safe onto staging
        run: flutter test test/unit/app_environment_test.dart

      - name: Each flavor resolves to its own backend
        run: |
          for f in dev staging prod; do
            echo "--- $f"
            flutter test test/unit/app_environment_test.dart \
              --dart-define-from-file=env/$f.json
          done

      - name: env files stay in sync with the flavors
        run: |
          python3 - <<'PY'
          import json, sys
          expected = {'dev', 'staging', 'prod'}
          seen = set()
          for f in sorted(expected):
              d = json.load(open(f'env/{f}.json'))
              for k in ('WADDI_FLAVOR', 'WADDI_BASE_URL', 'WADDI_WEB_URL'):
                  if k not in d:
                      print(f"::error::env/{f}.json missing {k}")
                      sys.exit(1)
              if d['WADDI_FLAVOR'] != f:
                  print(f"::error::env/{f}.json declares flavor {d['WADDI_FLAVOR']}")
                  sys.exit(1)
              for k in ('WADDI_BASE_URL', 'WADDI_WEB_URL'):
                  if d[k].endswith('/'):
                      print(f"::error::env/{f}.json {k} has a trailing slash")
                      sys.exit(1)
              seen.add(f)
          # Only prod may point at the production host.
          prod = json.load(open('env/prod.json'))
          if 'waddyapp.com' not in prod['WADDI_BASE_URL']:
              print("::error::env/prod.json does not point at production")
              sys.exit(1)
          # dev/staging SHOULD point somewhere other than production — but there
          # is no staging backend yet (staging.waddyapp.com is NXDOMAIN), so
          # they currently share the production host and carry a TODO saying so.
          # Warn, do not fail: failing here would block every PR on
          # infrastructure that does not exist yet.
          for f in ('dev', 'staging'):
              d = json.load(open(f'env/{f}.json'))
              if d['WADDI_BASE_URL'] == prod['WADDI_BASE_URL']:
                  if '_comment' not in d:
                      print(f"::error::env/{f}.json points at production with no TODO explaining why")
                      sys.exit(1)
                  print(f"::warning::env/{f}.json still points at production — "
                        f"tighten this once a staging backend exists")
          print(f"ok: {sorted(seen)}")
          PY

  silent-failure-guard:
    # A bare `catch (_) {}` cannot be distinguished from an oversight. Some
    # silences are correct — analytics must never break a checkout — but the
    # reason has to be written down, because one of these hid a hanging zone
    # lookup for a long time (see location_controller.dart).
    #
    # `swallow(reason, e, s)` is the sanctioned form; pass `true` as the last
    # argument to also record a non-fatal in Crashlytics.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No unexplained empty catch blocks
        run: |
          # analytics_helper.dart is exempt by design: its class doc states
          # analytics must never break a user flow, and reporting an analytics
          # failure through analytics would loop. swallow.dart's own doc
          # comment shows the pattern it replaces.
          hits=$(grep -rnE "catch \([_a-z]+\) \{\s*\}" lib --include="*.dart" \
                   | grep -v "^lib/helper/analytics_helper.dart:" \
                   | grep -v "^lib/util/swallow.dart:" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::empty catch — use swallow('reason', e, s) so the silence is explained"
            exit 1
          fi
          echo "clean"

  route-guard:
    # Deep linking is live (app_links), so a URL can open any named route
    # directly. Two properties have to hold for that to be safe: routes that
    # expose a user's own data refuse to open without a session, and no route
    # parses an attacker-supplied parameter in a way that can throw.
    #
    # The sensitive-route list and the deliberate exclusions (payment,
    # orderSuccess — both carry guest_id for the guest-to-account conversion)
    # live in the test, where the reasons are written down.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
      - run: flutter pub get

      - name: Sensitive routes are authenticated
        run: flutter test test/unit/route_guard_test.dart

      - name: No throwing parse of route parameters
        run: |
          if grep -nE "(int|double)\.parse\(Get\.parameters" lib --include="*.dart" -r; then
            echo "::error::a malformed deep link would crash here — use _paramInt / _paramDouble"
            exit 1
          fi
          echo "clean"

  parse-guard:
    # Values from the server and from URLs must not be parsed in a way that can
    # throw. The JSON boundary is closed: every `fromJson` goes through `Parse`.
    #
    # The split matters more than the count. `Parse.lenient*` is for display
    # values, where a fallback harms nobody. `Parse.strict*` is for money,
    # quantities and identifiers: it returns null and reports, so the caller
    # has to decide — because a missing price silently becoming 0 is a
    # plausible wrong number that reaches a real payment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
      - run: flutter pub get

      - name: Parse helpers behave
        run: flutter test test/unit/parse_test.dart

      - name: No raw parse at the JSON boundary
        run: |
          # `Parse` itself is the one place tryParse is called directly.
          hits=$(grep -rnE "(int|double)\.parse\(" lib --include="*.dart" \
                   | grep "json\[" \
                   | grep -v "^lib/util/parse.dart:" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::parse a server value with Parse.strict* (money/ids) or Parse.lenient* (display)"
            exit 1
          fi
          echo "clean"

      - name: Raw parse budget elsewhere
        run: |
          # RATCHET: widget- and controller-level parses of server strings.
          # Lower as they migrate; it must never rise.
          BUDGET=183
          n=$(grep -rhoE "(int|double)\.parse\(" lib --include="*.dart" | wc -l | tr -d ' ')
          echo "raw parses: $n (budget $BUDGET)"
          [ "$n" -le "$BUDGET" ] || { echo "::error::raw parse count rose to $n"; exit 1; }
