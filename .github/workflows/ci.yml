name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  mobile-only-guard:
    # Waddi ships to Android and iOS only. The upstream template this app forked
    # from was multi-platform, so web code paths keep finding their way back in
    # through merges. Dart has no forbidden-import lint, so this is a grep.
    # See docs/mobile_only_plan.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No web or desktop platform directories
        run: |
          for d in web windows macos linux; do
            if [ -d "$d" ]; then
              echo "::error::'$d/' exists — this project targets Android and iOS only."
              exit 1
            fi
          done

      - name: No web or desktop code paths in lib/
        run: |
          if grep -rnE "dart:html|package:universal_html|package:pointer_interceptor|url_strategy|kIsWeb|GetPlatform\.(isWeb|isDesktop|isWindows|isMacOS|isLinux|isFuchsia)|ResponsiveHelper" lib --include="*.dart"; then
            echo "::error::web/desktop code path reintroduced — see docs/mobile_only_plan.md"
            exit 1
          fi
          echo "clean"

      - name: No web-only packages in pubspec
        run: |
          if grep -nE "^\s+(universal_html|pointer_interceptor|url_strategy|google_maps_flutter_web|google_sign_in_web|image_network):" pubspec.yaml; then
            echo "::error::web-only package reintroduced in pubspec.yaml"
            exit 1
          fi
          echo "clean"

  money-parity-guard:
    # The client must predict the server's total exactly. The server is
    # authoritative — PlaceNewOrder.php recomputes order_amount on every order
    # — so a divergence here means the customer is shown one price and charged
    # another. The vectors are generated by PHP itself; see
    # docs/money_rounding.md and tool/generate_rounding_vectors.php.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
      - run: flutter pub get

      - name: Rounding parity with the backend
        run: flutter test test/contract/rounding_parity_test.dart

      - name: No truncating money math
        # `.floor()` on a scaled price is the original bug: it truncated where
        # the server rounded. roundLikeServer() is the only sanctioned path.
        run: |
          if grep -rnE "\* *mod\)[^;]*\.floor\(\)|toPrecision\([^)]*\)\)\.floor" lib --include="*.dart"; then
            echo "::error::truncating money math reintroduced — use roundLikeServer()"
            exit 1
          fi
          echo "clean"

  credential-guard:
    # The auth token is a bearer credential and belongs in encrypted storage
    # (Keystore / Keychain), not SharedPreferences. AuthTokenStore owns it and
    # keeps a synchronous cache so the 18 read sites stay synchronous.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Token is not read from SharedPreferences
        run: |
          # AuthTokenStore itself legitimately touches the legacy key to migrate
          # it; everyone else must go through AuthTokenStore.
          if grep -rn "AppConstants\.token\b" lib --include="*.dart" \
               | grep -v "^lib/helper/auth_token_store.dart:"; then
            echo "::error::read the auth token via AuthTokenStore, not SharedPreferences"
            exit 1
          fi
          echo "clean"

      - name: No client-side signing secret
        # A secret the app can use is a secret an attacker can extract. Any
        # tamper-evidence scheme must be server-issued.
        run: |
          if grep -rnE "hmac[_-]?secret|Hmac\(sha256, *utf8\.encode\(_" lib --include="*.dart"; then
            echo "::error::client-side signing secret reintroduced — must be server-issued"
            exit 1
          fi
          echo "clean"

  dead-code-guard:
    # An unreachable file is a maintenance liability and the reason "which
    # widget is actually live?" keeps costing time. This walks the real import
    # graph (imports, exports, parts, relative paths, from main.dart and every
    # test) rather than grepping for filenames, so it also catches files that
    # are only reachable from other dead files.
    #
    # RATCHET: lower BUDGET as files are deleted. It must never rise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable

      - name: Unreachable files under lib/
        run: |
          # Ratcheted to zero on 2026-09-20, when the 132 files / 30,216 lines
          # this budget was tracking were deleted. It does not go back up: a
          # new unreachable file is either dead on arrival or not wired up yet,
          # and both are worth failing on.
          BUDGET=0
          n=$(dart run tool/find_unused_files.dart --list | grep -c . || true)
          echo "unreachable files: $n (budget $BUDGET)"
          if [ "$n" -gt "$BUDGET" ]; then
            dart run tool/find_unused_files.dart || true
            echo "::error::$n unreachable file(s) — delete them or wire them up"
            exit 1
          fi

  i18n-guard:
    # A key used in code but absent from a language file renders as the RAW KEY
    # to that language's users — silently, with nothing failing until someone
    # sees a screenshot.
    #
    # This checks what actually matters: every `.tr` key in lib/ exists in BOTH
    # files. It deliberately does NOT require the two files to hold identical
    # key sets — see docs/architecture_hardening_plan.md §21. Both carry ~1,300
    # keys no code references, inherited from the upstream template, and
    # demanding parity between two piles of dead data enforces nothing while
    # failing honest PRs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every used key exists in every language
        run: |
          python3 - <<'PY'
          import json, re, pathlib, sys

          langs = {p.stem: json.load(open(p))
                   for p in pathlib.Path('assets/language').glob('*.json')}

          used = set()
          for path in pathlib.Path('lib').rglob('*.dart'):
              text = path.read_text(errors='ignore')
              used |= set(re.findall(r"'([a-z0-9_]{3,})'\s*\.tr\b", text))
              used |= set(re.findall(r'"([a-z0-9_]{3,})"\s*\.tr\b', text))

          print(f"{len(used)} distinct .tr keys in lib/")
          failed = False
          for name, table in sorted(langs.items()):
              missing = sorted(used - set(table))
              status = "ok" if not missing else f"MISSING {len(missing)}"
              print(f"  {name}.json: {len(table)} keys, {status}")
              if missing:
                  print("    " + ", ".join(missing[:25]))
                  failed = True

          if failed:
              print("::error::a used key is absent from a language file — it will "
                    "render as the raw key to those users")
          sys.exit(1 if failed else 0)
          PY

